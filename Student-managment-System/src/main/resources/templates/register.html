<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#198754,#20c997);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
            padding:20px;
        }

        .register-card{
            width:100%;
            max-width:500px;
            border:none;
            border-radius:20px;
            overflow:hidden;
        }

        .card-header{
            background:#198754;
            color:white;
            text-align:center;
            padding:25px;
        }

        .register-icon{
            font-size:55px;
            margin-bottom:10px;
        }

        .form-control{
            height:48px;
        }

        .btn-register{
            height:48px;
            font-weight:600;
        }

        .password-wrapper{
            position:relative;
        }

        .toggle-password{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#6c757d;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            text-decoration:none;
            font-weight:600;
        }

    </style>
</head>
<body>

<div class="card shadow-lg register-card">

    <div class="card-header">
        <div class="register-icon">🎓</div>
        <h3 class="mb-0">Student Registration</h3>
        <small>Create Your Account</small>
    </div>

    <div class="card-body p-4">

        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post" onsubmit="return validatePassword()">

            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter Full Name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Choose Username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Email Address"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter Password"
                           required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('password')"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm Password"
                           required>

                    <i class="fa-solid fa-eye toggle-password"
                       onclick="togglePassword('confirmPassword')"></i>
                </div>

                <small id="passwordError" class="text-danger"></small>
            </div>

            <button type="submit"
                    class="btn btn-success w-100 btn-register">
                <i class="fas fa-user-plus"></i>
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a th:href="@{/login}">
                Login Here
            </a>
        </div>

    </div>

    <div class="card-footer text-center bg-light">
        <small class="text-muted">
            © 2026 Student Management System
        </small>
    </div>

</div>

<script>

    function togglePassword(id){
        const field = document.getElementById(id);

        if(field.type === "password"){
            field.type = "text";
        }else{
            field.type = "password";
        }
    }

    function validatePassword(){

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const error = document.getElementById("passwordError");

        if(password !== confirmPassword){
            error.innerText = "Passwords do not match.";
            return false;
        }

        error.innerText = "";
        return true;
    }

</script>

</body>
</html>
