<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Student Management System</h2>

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>
            <!-- Back Button -->
            <a th:href="@{/}" class="btn btn-secondary me-2">
                ← Back to Dashboard
            </a>

            <!-- Add Student Button -->
            <a th:href="@{/students/new}" class="btn btn-primary">
                Add Student
            </a>
        </div>

        <!-- Search Form -->
        <form class="d-flex" th:action="@{/students}" method="get">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control me-2"
                   placeholder="Search by Name">

            <input type="text"
                   name="dept"
                   th:value="${dept}"
                   class="form-control me-2"
                   placeholder="Department">

            <button type="submit" class="btn btn-success">
                Search
            </button>

        </form>

    </div>

    <!-- STUDENT TABLE -->
    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Photo</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Department</th>
            <th>Email</th>
            <th width="180">Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="student : ${studentPage.content}">

            <td th:text="${student.id}"></td>

            <!-- Student Photo -->
            <td>

                <img th:if="${student.imageName != null}"
                     th:src="@{/uploads/{img}(img=${student.imageName})}"
                     width="80"
                     height="80"
                     class="rounded-circle border">

                <span th:if="${student.imageName == null}">
                    No Image
                </span>

            </td>

            <td th:text="${student.firstName}"></td>
            <td th:text="${student.lastName}"></td>
            <td th:text="${student.department}"></td>
            <td th:text="${student.email}"></td>

            <td>

                <a th:href="@{/students/edit/{id}(id=${student.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this student?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <!-- No Data -->
    <div th:if="${studentPage.totalElements == 0}"
         class="alert alert-danger text-center">

        No Students Found

    </div>

    <!-- Pagination -->
    <nav th:if="${studentPage.totalPages > 1}">
        <ul class="pagination justify-content-center">

            <!-- Previous -->
            <li class="page-item"
                th:if="${studentPage.hasPrevious()}">

                <a class="page-link"
                   th:href="@{/students(page=${studentPage.number-1},
                                        keyword=${keyword},
                                        dept=${dept},
                                        sortField=${sortField},
                                        sortDir=${sortDir})}">
                    Previous
                </a>

            </li>

            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, studentPage.totalPages-1)}"
                th:classappend="${i == studentPage.number} ? 'active'">

                <a class="page-link"
                   th:text="${i+1}"
                   th:href="@{/students(page=${i},
                                        keyword=${keyword},
                                        dept=${dept},
                                        sortField=${sortField},
                                        sortDir=${sortDir})}">
                </a>

            </li>

            <!-- Next -->
            <li class="page-item"
                th:if="${studentPage.hasNext()}">

                <a class="page-link"
                   th:href="@{/students(page=${studentPage.number+1},
                                        keyword=${keyword},
                                        dept=${dept},
                                        sortField=${sortField},
                                        sortDir=${sortDir})}">
                    Next
                </a>

            </li>

        </ul>
    </nav>

</div>

</body>
</html>
